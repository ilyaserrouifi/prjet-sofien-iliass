            "tag": "Introduction Générale",
            "heading": "Introduction Générale",
            "body": "<p>Depuis les travaux pionniers de George Dantzig sur la programmation linéaire dans les années 1940, l'optimisation combinatoire s'est imposée comme une branche essentielle des mathématiques appliquées et de l'informatique théorique. Ce domaine se consacre à la recherche d'une solution optimale au sein d'un ensemble discret et fini de configurations. Sa pertinence est aujourd'hui universelle, intervenant dans un large spectre d'applications réelles : en mathématiques financières (gestion de portefeuilles d'actions), pour la navigation de véhicules autonomes (traitement en temps réel des données capteurs).</p><p>Au cœur de l'optimisation combinatoire, le Problème du Voyageur de Commerce (TSP - Traveling Salesman Problem) occupe une place emblématique. Véritable pierre angulaire de la discipline, sa première formulation mathématique rigoureuse a été introduite par Dantzig, Fulkerson et Johnson en 1954, déclinée sous ses formes symétrique et asymétrique.</p><div class=\"pill-row\"><span>Chapitre 1 Introduction GénéraleContexte, historique, présentation du TSP.</span><span>Chapitre 2 Optimisation CombinatoireDéfinitions, programmation linéaire en nombres entiers (PLNE), programmation stochastique, classification des méthodes.</span><span>Chapitre 3 Calculabilité & DécidabilitéMachines de Turing, thèse de Church-Turing, problème de l'arrêt, frontière décidable/indécidable.</span><span>Chapitre 4 Complexité : P, NP, NP-Complet, NP-DifficileClasses de complexité, réduction polynomiale, conjecture P vs NP, preuve de NP-complétude du TSP.</span></div>",

            "heading": "Optimisation Combinatoire",
            "body": "<p>L'optimisation mathématique est la science de la détermination du meilleur choix parmi un ensemble de solutions réalisables. Elle est définie par la recherche d'un extremum d'une fonction numérique appelée fonction objectif.</p><p>Les problèmes d'optimisation combinatoire constituent une classe de problèmes qui cherche à trouver la solution optimale parmi un ensemble fini de choix. Or, pour la plupart des problèmes de cette classe, la taille de l'espace de recherche croît de manière exponentielle avec la taille du problème en entrée, et la recherche d'une solution optimale exacte est généralement infaisable sur le plan informatique.</p>",

            "heading": "La programmation linéaire en nombre entier",
            "body": "<p>On dit qu'un programme mathématique est présenté sous forme d'un programme linéaire (noté : PL) lorsque sa fonction-objectif et ses contraintes sont linéaires. Un problème de programmation linéaire consiste à minimiser (ou à maximiser) une fonction linéaire sous certaines contraintes linéaires.</p>",
            "kind": "default"

      {
            "part": "Chapitre 2",

            "body": "<p>La notion d'incertitude dans la programmation mathématique est apparue pour la première fois dans les années 50 avec les travaux de Bellman, Vela et al., John R. Birge, et elle a rencontré depuis un développement rapide. L'incertitude dans les problèmes d'optimisation touche notamment les coûts de production, les prix des marchés, les pénalités en cas de violations des contrats, aussi bien que la demande de clients, les délais de livraison, les temps de traitement, la disponibilité des machines et d'autres coefficients technologiques.</p><p>Il se peut que l'on connaisse partiellement certains aspects du phénomène à travers soit des scénarios, soit un historique, soit une loi de probabilité, soit des variables aléatoires (par exemple espérance mathématique, variance). Des scénarios peuvent être créés à partir des historiques (comme par exemple les ventes des dernières années, les températures de la dernière décennie, la mortalité d'une certaine population).</p>",
            "kind": "default"

            "part": "Chapitre 2",

            "heading": "Définition",

            "part": "Chapitre 2",

            "heading": "Domaines d'Application de l'Aide à la Décision",
            "body": "<p>L'optimisation combinatoire est un levier de performance dans plusieurs secteurs stratégiques :</p><p>Les mathématiques de l'optimisation et de la décision concernent des mathématiques appliquées dans des domaines tels que :</p><div class=\"pill-row\"><span>l'analyse non linéaire;</span><span>le contrôle optimal;</span><span>la théorie des jeux;</span><span>la recherche opérationnelle;</span></div>",

            "tag": "Conclusion",
            "heading": "Conclusion",
            "body": "<p>En conclusion, ce chapitre a permis d'établir les fondements mathématiques et structurels indispensables à l'étude de l'optimisation combinatoire et de l'aide à la décision. En formalisant la recherche d'un optimum global sur un ensemble discret et fini S ⊂ {0,1}n, nous avons mis en évidence le défi majeur de cette discipline : l'explosion exponentielle de l'espace de recherche qui rend toute énumération exhaustive impraticable à grande échelle.</p><p>À travers l'étude de la programmation mathématique, nous avons analysé la complémentarité de deux paradigmes essentiels : d'une part, la programmation linéaire en nombres entiers (PLNE), qui offre un cadre déterministe rigoureux pour caractériser géométriquement les solutions admissibles ; d'autre part, la programmation stochastique, qui introduit la modélisation de l'incertitude et des scénarios probabilistes pour garantir des décisions robustes en moyenne ou en espérance mathématique.</p>",
            "kind": "default"
      },

            "part": "Chapitre 3",
            "title": "Calculabilité et décidabilité",
            "subtitle": "Machines de Turing, décidabilité et limites du calcul.",
            "tag": "Calculabilité & Décidabilité",
            "heading": "Calculabilité & Décidabilité",
            "body": "<p>La théorie de la calculabilité est née dans les années 1930 avec les travaux d'Alan Turing, Alonzo Church et Kurt Gödel. Elle répond à une question fondamentale : quels problèmes peuvent être résolus par un algorithme ? Avant de chercher à résoudre efficacement le problème du voyageur de commerce, il faut d'abord savoir s'il est possible de le résoudre tout court.</p><p>Le problème du voyageur de commerce est décidable car l'ensemble des tours est fini : on peut toujours énumérer tous les tours et choisir le meilleur. Mais cette énumération est inutilisable en pratique pour des instances de taille modeste. La théorie de la calculabilité ne dit rien sur l'efficacité. C'est pourquoi nous avons besoin du chapitre suivant sur la théorie de la complexité.</p>",
            "kind": "default"

      {
            "part": "Chapitre 3",

            "heading": "La calculabilité",

            "kind": "default"
      },

            "part": "Chapitre 3",

            "tag": "Machine de Turing",
            "heading": "Machine de Turing",
            "body": "<p>Avant Turing, la notion d'\"algorithme\" ou de \"procédure effective\" était intuitive mais floue. Turing a proposé en 1936 un modèle mathématique simple mais extrêmement puissant : la Machine de Turing (MT). Ce modèle est devenu la référence pour définir ce qui est calculable.</p><p>Composants : Un ruban infini, une tête de lecture/écriture, un contrôleur d'état.</p>",

            "heading": "Exemple : Reconnaissance du langage {0ⁿ1ⁿ | n ≥ 0}",
            "body": "<p>Machine simple qui reconnaît les chaînes de la forme 0ⁿ1ⁿ (autant de 0 que de 1) :</p><p>États : q₀ (début), q₁ (cherche 1), q₂ (retour arrière), qacc, qrej. Transition : remplacer le premier 0 par X, puis trouver le premier 1, le remplacer par Y, revenir en arrière, et répéter. Résultat : Cette machine s'arrête toujours et accepte exactement les mots 0ⁿ1ⁿ. Ce langage est décidable.</p>",

            "heading": "Thèse de Church-Turing",

            "kind": "default"
      },

            "part": "Chapitre 3",

            "tag": "Problème de l'arrêt (Halting Problem)",
            "heading": "Problème de l'arrêt (Halting Problem)",
            "body": "<p>Preuve par diagonalisation : Supposons qu'il existe une MT H décidant HALT. Construisons D qui, sur l'entrée ⟨M⟩ : (1) exécute H sur ⟨M,⟨M⟩⟩, (2) si H accepte, D boucle, (3) si H rejette, D accepte. Appliquons D à ⟨D⟩ : si D s'arrête alors H accepte, donc D boucle (contradiction). Si D boucle alors H rejette, donc D s'arrête (contradiction). Donc H n'existe pas.</p>",

      },

    let index = 0;
    const splitTitle = (title) => { const words = title.split(' '); const mid = Math.ceil(words.length / 2); return `${words.slice(0, mid).join(' ')}<span>${words.slice(mid).join(' ')}</span>`; };
    function qr() { if (!window.QRCode) return; const p=document.getElementById('qr-presentation'), a=document.getElementById('qr-app'); if(p && !p.dataset.done){new QRCode(p,{text:'https://prjet-sofien-iliass.vercel.app/',width:180,height:180,colorDark:'#c9a84c',colorLight:'#fff'});p.dataset.done='1'} if(a && !a.dataset.done){new QRCode(a,{text:'https://ilyaserrouifi.github.io/tsp-world-pro-ilyas-errouifi/',width:180,height:180,colorDark:'#c9a84c',colorLight:'#fff'});a.dataset.done='1'} }
    function render() { const s=slides[index]; document.getElementById('leftPart').textContent=s.part; document.getElementById('leftTitle').innerHTML=splitTitle(s.title); document.getElementById('leftSubtitle').textContent=s.subtitle; document.getElementById('slideNum').textContent=String(index+1).padStart(2,'0'); document.getElementById('slideTag').textContent=s.tag; document.getElementById('slideHeading').textContent=s.heading; document.getElementById('slideBody').innerHTML=s.body; document.getElementById('counter').textContent=`Slide ${index+1} / ${slides.length}`; document.getElementById('bar').style.width=`${((index+1)/slides.length)*100}%`; qr(); }
    document.getElementById('prev').onclick=()=>{index=(index-1+slides.length)%slides.length;render()}; document.getElementById('next').onclick=()=>{index=(index+1)%slides.length;render()}; document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){index=(index+1)%slides.length;render()} if(e.key==='ArrowLeft'){index=(index-1+slides.length)%slides.length;render()}}); render();
