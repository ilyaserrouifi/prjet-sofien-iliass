    let index = 0;
    const chapterNames = [...new Set(slides.map(s => s.chapter))];
    const nav = document.getElementById('chapters');
    chapterNames.forEach((chapter) => {
      const first = slides.find(s => s.chapter === chapter);
      const button = document.createElement('button');
      button.innerHTML = `${chapter}<small>${first.part}</small>`;
      button.addEventListener('click', () => { index = slides.findIndex(s => s.chapter === chapter); render(); });
      nav.appendChild(button);
    });
    function splitTitle(title) { const words = title.split(' '); const mid = Math.ceil(words.length / 2); return `${words.slice(0, mid).join(' ')}<span style="display:block;color:#f3ca58">${words.slice(mid).join(' ')}</span>`; }
    function renderQr() {
      if (!window.QRCode) return;
      const pfe = document.getElementById('qr-pfe'); const app = document.getElementById('qr-app');
      if (pfe && !pfe.dataset.done) { new QRCode(pfe, { text:'https://prjet-sofien-iliass.vercel.app/', width:180, height:180, colorDark:'#c9a84c', colorLight:'#ffffff' }); pfe.dataset.done = '1'; }
      if (app && !app.dataset.done) { new QRCode(app, { text:'https://ilyaserrouifi.github.io/tsp-world-pro-ilyas-errouifi/', width:180, height:180, colorDark:'#c9a84c', colorLight:'#ffffff' }); app.dataset.done = '1'; }
    }
    function render() {
      const s = slides[index];
      document.getElementById('chapterBadge').textContent = s.part;
      document.getElementById('chapterTitle').innerHTML = splitTitle(s.title);
      document.getElementById('chapterIntro').textContent = s.subtitle;
      document.getElementById('slideNumber').textContent = String(index + 1).padStart(2, '0');
      document.getElementById('slideTag').textContent = s.tag;
      document.getElementById('slideTitle').textContent = s.heading;
      document.getElementById('slideBody').innerHTML = s.body;
      document.getElementById('counter').textContent = `Slide ${index + 1} / ${slides.length}`;
      document.getElementById('bar').style.width = `${((index + 1) / slides.length) * 100}%`;
      document.querySelectorAll('#chapters button').forEach((button) => button.classList.toggle('active', button.textContent.includes(s.chapter)));
      renderQr();
    }
    document.getElementById('prev').addEventListener('click', () => { index = (index - 1 + slides.length) % slides.length; render(); });
    document.getElementById('next').addEventListener('click', () => { index = (index + 1) % slides.length; render(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'ArrowRight' || event.key === ' ') { index = (index + 1) % slides.length; render(); } if (event.key === 'ArrowLeft') { index = (index - 1 + slides.length) % slides.length; render(); } });
    render();
  </script>
</body>
</html>
