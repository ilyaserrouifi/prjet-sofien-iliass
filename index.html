let index=0;const chapters=[...new Set(slides.map(s=>s.ch))],nav=document.getElementById('chapters');chapters.forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.onclick=()=>{index=slides.findIndex(s=>s.ch===ch);render()};nav.appendChild(b)});function splitTitle(t){const w=t.split(' '),m=Math.ceil(w.length/2);return w.slice(0,m).join(' ')+"<span class='gold'>"+w.slice(m).join(' ')+"</span>"}function badge(s){return s.ch.startsWith('Ch.')?'CHAPITRE '+s.ch.split('.')[1]:s.ch.toUpperCase()}function render(){const s=slides[index];document.querySelector('.panel').style.background=`linear-gradient(155deg,#10243a,var(--teal))`;document.getElementById('chapterBadge').textContent=badge(s);document.getElementById('chapterTitle').innerHTML=splitTitle(s.title);document.getElementById('chapterIntro').textContent=s.intro;document.getElementById('slideNumber').textContent=String(index+1).padStart(2,'0');document.getElementById('slideTag').textContent=s.tag;document.getElementById('slideTitle').textContent=s.t;document.getElementById('slideBody').innerHTML=s.b;document.getElementById('counter').textContent=`Slide ${index+1} / ${slides.length}`;document.getElementById('bar').style.width=`${(index+1)/slides.length*100}%`;document.querySelectorAll('#chapters button').forEach(b=>b.classList.toggle('active',b.textContent===s.ch))}document.getElementById('prev').onclick=()=>{index=(index-1+slides.length)%slides.length;render()};document.getElementById('next').onclick=()=>{index=(index+1)%slides.length;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){index=(index+1)%slides.length;render()}if(e.key==='ArrowLeft'){index=(index-1+slides.length)%slides.length;render()}});render();
