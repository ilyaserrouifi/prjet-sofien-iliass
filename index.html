<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides PFE | Optimisation Combinatoire & TSP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #10243a;
      --teal: #0f9fa8;
      --gold: #c9a84c;
      --paper: #fbfaf7;
      --ink: #17243a;
      --muted: #64748b;
      --line: #dfe8ef;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Raleway', sans-serif;
      color: var(--ink);
      background:
        linear-gradient(rgba(15,159,168,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,159,168,0.06) 1px, transparent 1px),
        #f5f8fb;
      background-size: 36px 36px;
    }
    .topbar {
      position: fixed; top: 12px; right: 24px; z-index: 30;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .topbar button, .topbar a {
      border: none; background: rgba(255,255,255,0.92); color: var(--ink);
      padding: 0.55rem 1rem; border-radius: 999px; cursor: pointer;
      font-family: 'Cinzel', serif; font-weight: 800; font-size: 0.68rem;
      text-decoration: none; box-shadow: 0 8px 25px rgba(16,36,58,0.10);
      transition: 0.25s ease;
    }
    .topbar button:hover, .topbar a:hover, .topbar .active { color: white; background: linear-gradient(135deg, var(--gold), var(--teal)); }
    .deck { height: 100vh; padding: 2.1rem 2.4rem 4.5rem; display: grid; place-items: center; }
    .slide {
      width: min(1180px, 94vw); height: min(620px, 82vh); display: grid;
      grid-template-columns: 36% 64%; background: rgba(255,255,255,0.96);
      border-radius: 28px; overflow: hidden; box-shadow: 0 25px 70px rgba(16,36,58,0.16);
      border: 1px solid rgba(223,232,239,0.85); position: relative;
    }
    .panel {
      background: radial-gradient(circle at 80% 0%, rgba(255,255,255,0.18), transparent 36%), linear-gradient(160deg, #10243a 0%, #126b7e 56%, #11a6aa 100%);
      color: white; padding: 4.4rem 3rem; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden;
    }
    .panel::before { content: ''; position: absolute; width: 390px; height: 390px; border: 2px solid rgba(255,255,255,0.10); border-radius: 50%; top: -115px; right: -125px; }
    .badge { align-self: flex-start; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 0.34rem 1rem; letter-spacing: 0.28rem; color: #f6d86d; font-weight: 800; font-size: 0.64rem; margin-bottom: 1.7rem; }
    .panel h1 { font-family: 'Cinzel', serif; font-size: clamp(2rem, 4vw, 3.35rem); line-height: 0.98; color: #07182d; text-shadow: 0 1px 0 rgba(255,255,255,0.18); text-transform: uppercase; }
    .panel h1 .gold { color: var(--gold); display: block; }
    .panel p { margin-top: 1.6rem; max-width: 320px; color: rgba(255,255,255,0.88); font-size: 1rem; line-height: 1.55; }
    .content { padding: 4.2rem 4rem; position: relative; display: flex; flex-direction: column; justify-content: center; }
    .number { position: absolute; top: 1.4rem; right: 2.2rem; font-family: 'Cinzel', serif; font-size: 4.2rem; color: rgba(201,168,76,0.13); font-weight: 900; }
    .tag { display: inline-block; color: var(--gold); border: 1px solid rgba(201,168,76,0.4); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.65rem; letter-spacing: 0.22rem; font-weight: 800; text-transform: uppercase; margin-bottom: 1rem; }
    .content h2 { font-family: 'Cinzel', serif; color: var(--navy); font-size: clamp(1.55rem, 2.8vw, 2.45rem); line-height: 1.08; text-transform: uppercase; padding-bottom: 1rem; border-bottom: 2px solid var(--line); max-width: 760px; }
    .content p { margin-top: 1.25rem; color: #3f4c61; line-height: 1.75; font-size: 1.02rem; max-width: 760px; }
    .content ul { margin-top: 1.15rem; padding-left: 1.15rem; color: #3f4c61; line-height: 1.7; font-size: 1rem; max-width: 790px; }
    .content li { margin-bottom: 0.45rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0.8rem; margin-top: 1.25rem; }
    .card { background: #f7fafc; border: 1px solid var(--line); border-radius: 16px; padding: 1rem; }
    .card strong { color: var(--teal); display: block; margin-bottom: 0.3rem; font-family: 'Cinzel', serif; }
    .formula { margin-top: 1.1rem; background: #eef5f8; border-left: 5px solid var(--teal); padding: 1rem 1.2rem; border-radius: 0 14px 14px 0; font-weight: 700; color: var(--navy); }
    .controls { position: fixed; left: 2rem; right: 2rem; bottom: 1.2rem; display: grid; grid-template-columns: 190px 1fr 190px; gap: 1.5rem; align-items: center; z-index: 30; }
    .navbtn { height: 48px; border: none; border-radius: 999px; font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 0.16rem; cursor: pointer; box-shadow: 0 8px 22px rgba(16,36,58,0.12); }
    .prev { background: white; color: var(--gold); border: 1px solid rgba(201,168,76,0.35); }
    .next { background: linear-gradient(135deg, var(--gold), var(--teal)); color: white; }
    .progress-wrap { text-align: center; font-weight: 800; color: #718096; font-size: 0.85rem; }
    .progress { width: 100%; height: 9px; background: #dce6ef; border-radius: 999px; margin-top: 0.55rem; overflow: hidden; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--teal)); border-radius: inherit; transition: width 0.25s; }
    @media (max-width: 860px) {
      html, body { overflow: auto; }
      .deck { height: auto; min-height: 100vh; padding: 5rem 1rem 6rem; }
      .slide { height: auto; min-height: 720px; grid-template-columns: 1fr; }
      .panel { padding: 2.2rem; }
      .content { padding: 2.2rem; }
      .grid { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; gap: 0.5rem; }
      .topbar { left: 10px; right: 10px; justify-content: center; }
    }
  </style>
</head>
<body>
  <nav class="topbar" id="chapters">
    <a href="pages/01-introduction.html">Détails</a>
  </nav>

  <main class="deck">
    <section class="slide" aria-live="polite">
      <aside class="panel">
        <div class="badge" id="chapterBadge">CHAPITRE</div>
        <h1 id="chapterTitle"></h1>
        <p id="chapterIntro"></p>
      </aside>
      <article class="content">
        <div class="number" id="slideNumber">01</div>
        <span class="tag" id="slideTag">Concept clé</span>
        <h2 id="slideTitle"></h2>
        <div id="slideBody"></div>
      </article>
    </section>
  </main>

  <footer class="controls">
    <button class="navbtn prev" id="prev">← Précédent</button>
    <div class="progress-wrap">
      <span id="counter">Slide 1 / 1</span>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
    <button class="navbtn next" id="next">Suivant →</button>
  </footer>

  <script>
    const slides = [
      {ch:'Intro', title:'Introduction Générale', intro:'Contexte du mémoire, problématique et fil conducteur.', tag:'Ouverture', t:'Projet de Fin d’Études', b:`<p>Ce mémoire étudie l’optimisation combinatoire appliquée au Problème du Voyageur de Commerce. L’objectif est de présenter les bases théoriques nécessaires, puis de montrer pourquoi le TSP est un modèle central pour comprendre la difficulté algorithmique et les méthodes de résolution.</p><div class="grid"><div class="card"><strong>Réalisé par</strong>Iliass Errouifi & Soufiane Er-Rthimi</div><div class="card"><strong>Encadré par</strong>Pr. EL HICHAMI OTHMANE</div></div>`},
      {ch:'Intro', title:'Introduction Générale', intro:'Contexte du mémoire, problématique et fil conducteur.', tag:'Contexte', t:'Pourquoi l’optimisation combinatoire ?', b:`<p>L’optimisation combinatoire cherche la meilleure solution dans un ensemble fini, discret et souvent très grand. Elle intervient lorsque les décisions possibles sont nombreuses : ordre de passage, affectation de ressources, choix d’un chemin, planification ou organisation d’un réseau.</p><ul><li>Les solutions possibles sont dénombrables.</li><li>La meilleure solution dépend d’un critère mesurable.</li><li>L’énumération exhaustive devient rapidement impossible.</li></ul>`},
      {ch:'Intro', title:'Introduction Générale', intro:'Contexte du mémoire, problématique et fil conducteur.', tag:'Problématique', t:'Le TSP comme problème central', b:`<p>Le Problème du Voyageur de Commerce consiste à trouver une tournée de coût minimal qui visite chaque ville exactement une fois et revient au point de départ. Malgré son énoncé simple, le nombre de tournées possibles augmente de façon explosive avec le nombre de villes.</p><div class="formula">Pour n villes : nombre de cycles symétriques = (n − 1)! / 2</div>`},
      {ch:'Intro', title:'Introduction Générale', intro:'Contexte du mémoire, problématique et fil conducteur.', tag:'Plan', t:'Structure générale du mémoire', b:`<div class="grid"><div class="card"><strong>Chapitre 1</strong>Introduction générale et contexte du TSP.</div><div class="card"><strong>Chapitre 2</strong>Calculabilité et décidabilité.</div><div class="card"><strong>Chapitre 3</strong>Complexité : P, NP, NP-complet et NP-difficile.</div><div class="card"><strong>Chapitre 4</strong>Définition, variantes et modélisation du TSP.</div><div class="card"><strong>Chapitre 5</strong>Méthodes exactes, approchées et métaheuristiques.</div><div class="card"><strong>Application</strong>Interface interactive TSP WORLD PRO.</div></div>`},
      {ch:'Ch.2', title:'Calculabilité & Décidabilité', intro:'Savoir si un problème peut être résolu par un algorithme.', tag:'Idée clé', t:'Qu’est-ce qu’un problème calculable ?', b:`<p>Un problème est calculable lorsqu’il existe une procédure algorithmique capable de produire un résultat correct après un nombre fini d’étapes. Cette notion permet de distinguer les questions qui peuvent être automatisées de celles qui dépassent les limites du calcul.</p><ul><li>Un algorithme doit être fini, précis et effectif.</li><li>Un problème peut être calculable sans être efficace.</li><li>La calculabilité précède l’étude de la complexité.</li></ul>`},
      {ch:'Ch.2', title:'Calculabilité & Décidabilité', intro:'Savoir si un problème peut être résolu par un algorithme.', tag:'Modèle', t:'Machine de Turing', b:`<p>La machine de Turing fournit un modèle mathématique simple pour formaliser la notion d’algorithme. Elle possède un ruban, une tête de lecture-écriture, des états internes et une fonction de transition qui décrit son comportement.</p><div class="formula">M = (Q, Σ, Γ, δ, q₀, q<sub>acc</sub>, q<sub>rej</sub>)</div>`},
      {ch:'Ch.2', title:'Calculabilité & Décidabilité', intro:'Savoir si un problème peut être résolu par un algorithme.', tag:'Décision', t:'Décidable ou indécidable ?', b:`<p>Un langage est décidable s’il existe une machine de Turing qui s’arrête toujours et répond correctement oui ou non. Certains problèmes, comme le problème de l’arrêt, sont indécidables : aucun algorithme général ne peut les résoudre dans tous les cas.</p><div class="grid"><div class="card"><strong>Décidable</strong>La machine s’arrête toujours.</div><div class="card"><strong>Semi-décidable</strong>La machine peut boucler dans certains cas.</div></div>`},
      {ch:'Ch.2', title:'Calculabilité & Décidabilité', intro:'Savoir si un problème peut être résolu par un algorithme.', tag:'Lien TSP', t:'Le TSP est décidable', b:`<p>Le TSP est décidable parce que le nombre de tournées possibles est fini. En théorie, on peut toutes les énumérer, calculer leurs coûts et choisir la meilleure. Mais cette solution naïve devient inutilisable dès que le nombre de villes augmente.</p><p>Cette observation conduit naturellement à la question suivante : si le TSP est résoluble, combien de temps faut-il pour le résoudre ?</p>`},
      {ch:'Ch.3', title:'Théorie de la Complexité', intro:'Mesurer le coût d’un algorithme et classer les problèmes.', tag:'Transition', t:'De la possibilité à l’efficacité', b:`<p>La calculabilité répond à la question : “peut-on résoudre le problème ?”. La complexité répond à une question plus pratique : “peut-on le résoudre efficacement ?”. On mesure alors le temps et la mémoire nécessaires en fonction de la taille de l’entrée.</p><ul><li>Temps polynomial : généralement considéré comme efficace.</li><li>Temps exponentiel : devient vite impraticable.</li><li>Le TSP illustre parfaitement cette différence.</li></ul>`},
      {ch:'Ch.3', title:'Théorie de la Complexité', intro:'Mesurer le coût d’un algorithme et classer les problèmes.', tag:'Classe P', t:'Classe P : problèmes traitables', b:`<p>La classe P contient les problèmes de décision qui peuvent être résolus en temps polynomial par un algorithme déterministe. Ces problèmes sont considérés comme efficacement résolubles.</p><div class="grid"><div class="card"><strong>Exemples</strong>Tri, plus court chemin, arbre couvrant minimal.</div><div class="card"><strong>Forme</strong>O(n), O(n log n), O(n²), O(n³)…</div></div>`},
      {ch:'Ch.3', title:'Théorie de la Complexité', intro:'Mesurer le coût d’un algorithme et classer les problèmes.', tag:'Classe NP', t:'Classe NP : solutions vérifiables', b:`<p>La classe NP regroupe les problèmes dont une solution candidate peut être vérifiée en temps polynomial. Pour le TSP décisionnel, si l’on donne une tournée et une borne K, il est facile de vérifier si la tournée respecte la borne.</p><div class="formula">TSP décisionnel : existe-t-il une tournée de coût ≤ K ?</div>`},
      {ch:'Ch.3', title:'Théorie de la Complexité', intro:'Mesurer le coût d’un algorithme et classer les problèmes.', tag:'Difficulté', t:'NP-complet et NP-difficile', b:`<p>Un problème NP-complet est à la fois dans NP et au moins aussi difficile que tous les problèmes de NP. Un problème NP-difficile peut être encore plus général : il n’est pas forcément dans NP, mais il est au moins aussi difficile que les problèmes NP-complets.</p><ul><li>TSP décisionnel : NP-complet.</li><li>TSP optimisation : NP-difficile.</li><li>Ces classes expliquent la difficulté pratique du problème.</li></ul>`},
      {ch:'Ch.3', title:'Théorie de la Complexité', intro:'Mesurer le coût d’un algorithme et classer les problèmes.', tag:'Synthèse', t:'Pourquoi P vs NP est important ?', b:`<p>La question P = NP demande si tout problème dont la solution est rapidement vérifiable est aussi rapidement résoluble. Si P = NP, de nombreux problèmes difficiles deviendraient théoriquement efficaces. Si P ≠ NP, il n’existe probablement pas d’algorithme polynomial exact pour les problèmes NP-complets.</p><p>Le TSP est donc un cas d’étude majeur pour tester les stratégies exactes et approchées.</p>`},
      {ch:'Ch.4', title:'Problème du Voyageur de Commerce', intro:'Définition, modélisation et variantes du TSP.', tag:'Définition', t:'Énoncé du TSP', b:`<p>Étant donné un ensemble de villes et les distances entre chaque paire de villes, le TSP cherche une tournée de coût minimal visitant chaque ville une seule fois avant de revenir à la ville de départ.</p><div class="formula">Minimiser la somme des distances du cycle hamiltonien.</div>`},
      {ch:'Ch.4', title:'Problème du Voyageur de Commerce', intro:'Définition, modélisation et variantes du TSP.', tag:'Graphe', t:'Modélisation par graphe', b:`<p>On représente le TSP par un graphe G = (V, E), où V est l’ensemble des villes et E l’ensemble des arêtes ou arcs reliant ces villes. Chaque arête possède un coût représentant une distance, un temps ou un prix.</p><ul><li>Sommet : ville ou client.</li><li>Arête : trajet possible.</li><li>Poids : coût associé au trajet.</li><li>Solution : cycle hamiltonien de coût minimal.</li></ul>`},
      {ch:'Ch.4', title:'Problème du Voyageur de Commerce', intro:'Définition, modélisation et variantes du TSP.', tag:'Variantes', t:'Principales variantes du TSP', b:`<div class="grid"><div class="card"><strong>TSP symétrique</strong>La distance i → j est égale à j → i.</div><div class="card"><strong>TSP asymétrique</strong>Les distances peuvent dépendre du sens.</div><div class="card"><strong>TSP métrique</strong>Les distances vérifient l’inégalité triangulaire.</div><div class="card"><strong>TSP avec contraintes</strong>Fenêtres de temps, plusieurs voyageurs, capacités.</div></div>`},
      {ch:'Ch.4', title:'Problème du Voyageur de Commerce', intro:'Définition, modélisation et variantes du TSP.', tag:'Explosion', t:'Explosion combinatoire', b:`<p>Le nombre de solutions augmente factorialement. Cela signifie qu’ajouter seulement quelques villes peut multiplier massivement le nombre de tournées possibles. Cette croissance rend les méthodes exactes coûteuses pour les grandes instances.</p><div class="grid"><div class="card"><strong>10 villes</strong>181 440 tournées symétriques.</div><div class="card"><strong>20 villes</strong>Plus de 10¹⁷ tournées.</div></div>`},
      {ch:'Ch.4', title:'Problème du Voyageur de Commerce', intro:'Définition, modélisation et variantes du TSP.', tag:'Applications', t:'Domaines d’utilisation', b:`<p>Le TSP sert de modèle abstrait pour de nombreux problèmes de tournée, d’ordonnancement et de planification. Il est aussi utilisé comme banc d’essai pour comparer les algorithmes d’optimisation.</p><ul><li>Planification de tournées et distribution.</li><li>Ordonnancement de tâches.</li><li>Conception de circuits et réseaux.</li><li>Comparaison de méthodes exactes et heuristiques.</li></ul>`},
      {ch:'Ch.5', title:'Méthodes de Résolution', intro:'Méthodes exactes, approximation et métaheuristiques.', tag:'Vue globale', t:'Deux grandes familles de méthodes', b:`<p>Les méthodes de résolution se divisent en méthodes exactes et méthodes approchées. Les méthodes exactes garantissent l’optimalité mais peuvent être lentes. Les méthodes approchées sont plus rapides et donnent de bonnes solutions sans toujours prouver l’optimalité.</p><div class="grid"><div class="card"><strong>Exactes</strong>Force brute, programmation dynamique, Branch & Bound, Branch & Cut.</div><div class="card"><strong>Approchées</strong>Heuristiques, approximation, métaheuristiques.</div></div>`},
      {ch:'Ch.5', title:'Méthodes de Résolution', intro:'Méthodes exactes, approximation et métaheuristiques.', tag:'Exact', t:'Force brute et programmation dynamique', b:`<p>La force brute énumère toutes les tournées et garantit la meilleure solution, mais son coût est factorial. La programmation dynamique de Held-Karp réduit cette explosion à O(n²·2ⁿ), ce qui reste exponentiel mais beaucoup plus efficace que l’énumération complète.</p><div class="formula">Held-Karp : O(n² · 2ⁿ)</div>`},
      {ch:'Ch.5', title:'Méthodes de Résolution', intro:'Méthodes exactes, approximation et métaheuristiques.', tag:'Exact', t:'Branch & Bound et Branch & Cut', b:`<p>Branch & Bound explore l’espace des solutions sous forme d’arbre et élimine les branches qui ne peuvent pas améliorer la meilleure solution connue. Branch & Cut ajoute des contraintes valides pour renforcer le modèle et accélérer la convergence.</p><ul><li>Garantit l’optimalité si l’exploration se termine.</li><li>Utilise des bornes inférieures et supérieures.</li><li>Très performant sur des instances structurées.</li></ul>`},
      {ch:'Ch.5', title:'Méthodes de Résolution', intro:'Méthodes exactes, approximation et métaheuristiques.', tag:'Approximation', t:'Algorithmes d’approximation', b:`<p>Les algorithmes d’approximation fournissent des garanties sur la qualité de la solution. Pour le TSP métrique, l’algorithme de Christofides donne une tournée dont le coût est au plus 1,5 fois le coût optimal.</p><div class="grid"><div class="card"><strong>Avantage</strong>Rapidité et garantie théorique.</div><div class="card"><strong>Limite</strong>Ne donne pas toujours la solution optimale.</div></div>`},
      {ch:'Ch.5', title:'Méthodes de Résolution', intro:'Méthodes exactes, approximation et métaheuristiques.', tag:'Métaheuristiques', t:'Recuit, tabou, génétique et fourmis', b:`<p>Les métaheuristiques explorent intelligemment l’espace de recherche pour obtenir rapidement de bonnes solutions. Elles sont adaptées aux grandes instances, surtout lorsqu’une solution optimale exacte est trop coûteuse à obtenir.</p><ul><li>Recuit simulé : accepte parfois de mauvaises solutions pour éviter les pièges locaux.</li><li>Recherche tabou : mémorise les mouvements interdits temporairement.</li><li>Algorithmes génétiques : sélection, croisement et mutation.</li><li>Colonies de fourmis : apprentissage collectif par phéromones.</li></ul>`},
      {ch:'Application', title:'TSP WORLD PRO', intro:'Application finale pour expérimenter le TSP.', tag:'Projet', t:'Interface interactive', b:`<p>L’application TSP WORLD PRO permet de visualiser des villes, construire une tournée, comparer des stratégies et mieux comprendre l’effet de la complexité sur le temps de résolution. Elle relie la partie théorique du mémoire à une démonstration concrète.</p><div class="grid"><div class="card"><strong>Carte</strong>Visualisation et interaction avec les points.</div><div class="card"><strong>Algorithmes</strong>Comparaison de méthodes de résolution.</div></div>`},
      {ch:'Conclusion', title:'Synthèse Générale', intro:'Résumé de tout le parcours.', tag:'Conclusion', t:'De la théorie à la pratique', b:`<p>Le TSP montre clairement la différence entre un problème décidable et un problème efficacement résoluble. L’étude de la calculabilité, de la complexité, de la modélisation et des méthodes de résolution permet de comprendre pourquoi l’optimisation combinatoire est à la fois théorique, pratique et essentielle.</p><ul><li>Le TSP est simple à énoncer mais difficile à résoudre.</li><li>Les méthodes exactes prouvent l’optimalité.</li><li>Les méthodes approchées permettent de traiter de grandes instances.</li><li>L’application finale illustre les concepts étudiés.</li></ul>`}
    ];

    let index = 0;
    const chapters = [...new Set(slides.map(s => s.ch))];
    const chapterNav = document.getElementById('chapters');
    chapters.forEach(ch => {
      const btn = document.createElement('button');
      btn.textContent = ch;
      btn.addEventListener('click', () => { index = slides.findIndex(s => s.ch === ch); render(); });
      chapterNav.appendChild(btn);
    });

    function render() {
      const s = slides[index];
      document.getElementById('chapterBadge').textContent = s.ch === 'Intro' ? 'CHAPITRE 1' : s.ch === 'Application' || s.ch === 'Conclusion' ? s.ch.toUpperCase() : s.ch.replace('Ch.', 'CHAPITRE');
      document.getElementById('chapterTitle').innerHTML = splitTitle(s.title);
      document.getElementById('chapterIntro').textContent = s.intro;
      document.getElementById('slideNumber').textContent = String(index + 1).padStart(2, '0');
      document.getElementById('slideTag').textContent = s.tag;
      document.getElementById('slideTitle').textContent = s.t;
      document.getElementById('slideBody').innerHTML = s.b;
      document.getElementById('counter').textContent = `Slide ${index + 1} / ${slides.length}`;
      document.getElementById('bar').style.width = `${((index + 1) / slides.length) * 100}%`;
      document.querySelectorAll('#chapters button').forEach(btn => btn.classList.toggle('active', btn.textContent === s.ch));
    }
    function splitTitle(title) {
      const words = title.split(' ');
      const first = words.slice(0, Math.ceil(words.length / 2)).join(' ');
      const second = words.slice(Math.ceil(words.length / 2)).join(' ');
      return `${first}<span class="gold">${second}</span>`;
    }
    document.getElementById('prev').addEventListener('click', () => { index = (index - 1 + slides.length) % slides.length; render(); });
    document.getElementById('next').addEventListener('click', () => { index = (index + 1) % slides.length; render(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ') { index = (index + 1) % slides.length; render(); }
      if (e.key === 'ArrowLeft') { index = (index - 1 + slides.length) % slides.length; render(); }
    });
    render();
  </script>
</body>
</html>
