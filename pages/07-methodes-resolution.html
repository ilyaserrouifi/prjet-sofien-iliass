<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TSP WORLD PRO | Présentation PFE – Optimisation Combinatoire</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Raleway:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator-1.4.4/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #0d1f3c 100%);
            color: #e8e0cc;
            overflow: hidden;
            height: 100vh;
        }
        .presentation-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .slides-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-in-out;
            overflow-y: auto;
            background: linear-gradient(135deg, #0a1428 0%, #0d1f3c 100%);
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }
        .slide::-webkit-scrollbar { width: 5px; }
        .slide::-webkit-scrollbar-track { background: #1e3a5f; }
        .slide::-webkit-scrollbar-thumb { background: #c9a84c; border-radius: 5px; }
        .slide-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 2.5rem;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #c9a84c;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .slide-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #e8e0cc;
        }
        .slide-title span { color: #c9a84c; }
        .slide-number {
            background: #1e3a5f;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #c9a84c;
        }
        .nav-controls {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.8rem;
            z-index: 100;
        }
        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1e3a5f;
            color: #c9a84c;
            border: 1px solid #c9a84c;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .nav-btn:hover { background: #c9a84c; color: #0a1428; transform: scale(1.05); }
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #c9a84c;
            transition: width 0.2s;
            z-index: 100;
        }
        .slide-counter {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            z-index: 100;
            color: #c9a84c;
        }
        h1 { font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 700; margin-bottom: 0.8rem; color: #e8e0cc; }
        h2 { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 600; margin: 0.8rem 0 0.5rem; border-left: 3px solid #c9a84c; padding-left: 0.8rem; color: #e8e0cc; }
        p { font-size: 0.95rem; line-height: 1.5; margin-bottom: 0.6rem; color: #cbd5e6; }
        .badge { display: inline-block; background: rgba(201,168,76,0.15); padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.7rem; font-weight: 500; color: #c9a84c; margin: 0.2rem; }
        .code-block { background: #0d1f2d; border-left: 3px solid #c9a84c; border-radius: 12px; padding: 0.8rem; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #c9a84c; margin: 0.8rem 0; white-space: pre-wrap; }
        .qr-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; margin: 1rem 0; }
        .qr-card { background: #0d1f2d; border-radius: 1rem; padding: 0.8rem; text-align: center; border: 1px solid #c9a84c; min-width: 150px; transition: 0.3s; }
        .qr-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        canvas.qr-canvas { width: 100px; height: 100px; display: block; margin: 0 auto; background: white; border-radius: 8px; padding: 4px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin: 0.8rem 0; }
        .stat-card { background: #0d1f2d; border-radius: 0.8rem; padding: 1rem; text-align: center; border: 1px solid #c9a84c; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 0.6rem 0; }
        th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #2a4a6e; }
        th { color: #c9a84c; font-weight: 600; }
        footer { margin-top: 1rem; text-align: center; font-size: 0.65rem; color: #6c8aac; }
        .hero-stats { display: flex; justify-content: center; gap: 2rem; margin: 1rem 0; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-number { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 800; color: #c9a84c; }
        .stat-label { font-size: 0.65rem; color: #8aaec0; text-transform: uppercase; letter-spacing: 1px; }
        .btn-launch { display: inline-block; padding: 0.6rem 1.5rem; background: #c9a84c; color: #0a1428; border-radius: 50px; text-decoration: none; font-size: 0.8rem; font-weight: 600; margin-top: 1rem; transition: 0.3s; cursor: pointer; }
        .btn-launch:hover { transform: scale(1.02); background: #e0c060; }
        .graph-schema { background: #0d1f2d; border-radius: 16px; padding: 1rem; text-align: center; margin: 1rem 0; border: 1px solid #c9a84c; }
        .graph-nodes { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; margin: 0.5rem 0; }
        .graph-node { background: #1e3a5f; color: #c9a84c; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #c9a84c; }
        .complexity-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; }
        .cb-easy { background: rgba(39,174,96,0.2); border: 1px solid rgba(39,174,96,0.5); color: #2ecc71; }
        .cb-hard { background: rgba(192,57,43,0.2); border: 1px solid rgba(192,57,43,0.5); color: #e74c3c; }
        @media (max-width: 768px) { .slide-content { padding: 1rem; } .slide-title { font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="presentation-container">
    <div class="slides-wrapper" id="slidesWrapper"></div>
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
        <button class="nav-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div class="progress-bar" id="progressBar"></div>
    <div class="slide-counter" id="slideCounter">Slide 1 / 50</div>
</div>

<script>
    function generateQR(containerId, text, size = 100) {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const cellSize = size / qr.getModuleCount();
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        for (let row = 0; row < qr.getModuleCount(); row++) {
            for (let col = 0; col < qr.getModuleCount(); col++) {
                ctx.fillStyle = qr.isDark(row, col) ? '#c9a84c' : '#ffffff';
                ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
            }
        }
        const container = document.getElementById(containerId);
        if (container) { container.innerHTML = ''; container.appendChild(canvas); }
    }

    const slides = [
        { title: "Optimisation <span>Combinatoire</span>", lines: ["🏛️ Université Abdelmalek Essaâdi – École Normale Supérieure Tétouan", "📖 Projet de Fin d'Études – Licence en Mathématiques", "👥 ER-RTHIMI Sofiane & ER-ROUFFI Ilyas", "📌 Encadré par : Pr. EL HICHAMI Othmane", "🎯 Optimisation Combinatoire appliquée au Problème du Voyageur de Commerce", "📅 Année universitaire 2025–2026"], isCover: true },
        { title: "Introduction <span>Générale</span>", lines: ["Le TSP est un problème d'optimisation combinatoire NP-difficile.", "Il consiste à trouver le cycle hamiltonien de coût minimal.", "Applications : logistique, robotique, bioinformatique, VLSI.", "Notre travail : théorie + application TSP WORLD PRO.", "5000+ lignes de code structuré."] },
        { title: "Plan du <span>Mémoire</span>", lines: ["Chapitre 1 : Optimisation Combinatoire", "Chapitre 2 : Calculabilité & Décidabilité", "Chapitre 3 : Complexité – P, NP, NP-Complet", "Chapitre 4 : Le Problème du Voyageur de Commerce", "Chapitre 5 : Programmation Dynamique – Held-Karp", "Chapitre 6 : Méthodes de Résolution – B&B, métaheuristiques", "Chapitre 7 : Application TSP WORLD PRO"] },
        { title: "Ch.1 · Optimisation <span>Combinatoire</span>", lines: ["Recherche de la meilleure solution parmi un ensemble discret.", "L'espace de recherche croît exponentiellement avec n.", "Min f(x) / x ∈ S ⊂ {0,1}ⁿ.", "Programmation linéaire en nombres entiers.", "Programmation stochastique : incertitude et scénarios."] },
        { title: "Ch.1 · Programmation <span>Linéaire</span>", lines: ["Min f(x) sous contraintes gᵢ(x) ≤ 0.", "Fonctions f et gᵢ linéaires.", "Algorithme du Simplex – efficace en pratique.", "Optimum global = meilleure solution admissible.", "Base de l'optimisation mathématique moderne."] },
        { title: "Ch.1 · Programmation <span>Stochastique</span>", lines: ["Incertitude : coûts, délais, demande clients.", "Modèles à 2 étapes : décision avant/après l'aléa.", "Scénarios créés à partir d'historiques.", "Espérance mathématique, variance.", "TSP Probabiliste (PTSP) : présence aléatoire des nœuds."] },
        { title: "Ch.2 · <span>Calculabilité</span>", lines: ["Née dans les années 1930 (Turing, Church, Gödel).", "Quels problèmes peuvent être résolus par un algorithme ?", "Machine de Turing : modèle universel.", "Thèse de Church-Turing : tout calculable est MT-calculable.", "Le TSP est décidable (espace fini)."] },
        { title: "Ch.2 · Machine de <span>Turing</span>", lines: ["Modèle M = (Q, Σ, Γ, δ, q₀, q_acc, q_rej).", "Ruban infini + tête lecture/écriture.", "Fonction de transition : δ(q,a) = (q',a',d).", "Acceptation = q_acc, rejet = q_rej.", "Peut boucler indéfiniment."], schema: "turing" },
        { title: "Ch.2 · Problème de <span>l'arrêt</span>", lines: ["HALT = {⟨M,w⟩ : M s'arrête sur w}.", "Théorème de Turing (1936) : indécidable.", "Preuve par diagonalisation – contradiction.", "Aucun algorithme universel d'arrêt n'existe.", "Le TSP, lui, est décidable."] },
        { title: "Ch.3 · Classe <span>P</span>", lines: ["P = problèmes résolus en temps polynomial O(nᵏ).", "Exemples : tri, plus court chemin, Dijkstra.", "Considérés comme « faciles ».", "Robuste : indépendant du modèle de calcul.", "P ⊆ NP."] },
        { title: "Ch.3 · Classe <span>NP</span>", lines: ["NP = vérifiable rapidement (certificat polynomial).", "Certificat TSP : une tournée donnée.", "Vérification en O(n).", "Recherche de solution = difficile.", "P = NP ? Question ouverte – prix 1M$."] },
        { title: "Ch.3 · NP-<span>complet</span>", lines: ["NP-complet = dans NP + tous NP s'y réduisent.", "SAT est NP-complet (Cook-Levin 1971).", "TSP décisionnel est NP-complet.", "Si TSP ∈ P alors P = NP.", "Problème du millénaire – 1 000 000 $."] },
        { title: "Ch.4 · Définition du <span>TSP</span>", lines: ["Étant donné n villes et les distances, trouver le plus court circuit passant par chaque ville exactement une fois.", "Cycle hamiltonien de coût minimal.", "L(π) = Σ d(vᵢ, vⱼ).", "NP-difficile – pas d'algorithme polynomial connu.", "Problème référence de l'optimisation."], schema: "tsp" },
        { title: "Ch.4 · Explosion <span>combinatoire</span>", lines: ["Nombre de tours = (n-1)!/2.", "n=10 → 181 440 tours.", "n=20 → 6×10¹⁶ tours (19 ans à 1Md/s).", "n=30 → 4×10³⁰ tours (> âge univers).", "Enumération exhaustive impossible."] },
        { title: "Ch.5 · Principe de <span>Bellman</span>", lines: ["Toute politique optimale contient des sous-politiques optimales.", "Sous-structure optimale + chevauchement.", "Base de la programmation dynamique.", "dp[S][j] = min(dp[S\\{j}][i] + d(i,j)).", "Solution finale : min_j dp[V][j] + d(j,1)."] },
        { title: "Ch.5 · Algorithme de <span>Held-Karp</span>", lines: ["Complexité : O(n²·2ⁿ) contre O(n!) pour force brute.", "Exact pour n ≤ 25 en pratique.", "Mémoire : O(n·2ⁿ) – bitmasks.", "Gain énorme : pour n=25, gain ×10¹⁴.", "Référence pour les petites instances."] },
        { title: "Ch.6 · Branch & <span>Bound</span>", lines: ["Méthode exacte : diviser + élaguer.", "Borne inférieure (relaxation d'affectation).", "Si borne ≥ meilleure solution → couper.", "Arbre de recherche exploré intelligemment.", "Résout n ≤ 35 en pratique."], schema: "bb" },
        { title: "Ch.6 · Branch & <span>Cut</span>", lines: ["Ajout de coupes (SEC) à la volée.", "Relaxation linéaire + contraintes lazy.", "Utilisé par Concorde (meilleur solveur).", "Résout des instances à 85 000 villes.", "Notre contribution : génération dynamique."] },
        { title: "Ch.6 · Recuit <span>Simulé</span>", lines: ["Inspiré du refroidissement des métaux.", "Accepte des solutions moins bonnes avec proba e^{-Δ/T}.", "Échappe aux optima locaux.", "Paramètres : T₀, α, critère d'arrêt.", "Gap typique < 2% sur grandes instances."] },
        { title: "Ch.6 · Algorithmes <span>Génétiques</span>", lines: ["Population de solutions qui évolue.", "Sélection, croisement (OX, PMX), mutation.", "Diversification naturelle.", "Très efficace pour les grandes instances.", "Souvent hybridé avec 2-opt."] },
        { title: "Ch.6 · Colonies de <span>Fourmis</span>", lines: ["Inspiré du comportement des fourmis.", "Dépôt de phéromone sur les arêtes.", "Évaporation pour éviter les cycles.", "Règle de transition probabiliste.", "Très performant sur TSP."] },
        { title: "Ch.7 · TSP <span>WORLD PRO</span>", lines: ["Application web professionnelle d'optimisation TSP.", "Carte interactive Leaflet / OpenStreetMap.", "Algorithmes : Nearest Neighbor, 2-OPT, Held-Karp.", "Géolocalisation GPS temps réel.", "Partage instantané par QR code."] },
        { title: "Ch.7 · Architecture <span>technique</span>", lines: ["Frontend : HTML5/CSS3/JS + Leaflet.", "Algorithmes TSP implémentés en JavaScript.", "Génération dynamique de QR codes.", "Déploiement sur Vercel et GitHub Pages.", "5000+ lignes de code structuré."] },
        { title: "Ch.7 · QR Codes <span>& Accès</span>", lines: ["Scannez pour accéder à l'application.", "Lien direct : https://prjet-sofien-iliass.vercel.app/", "Code source : GitHub", "Documentation complète en ligne.", "Version mobile prête à l'emploi."], hasQr: true },
        { title: "Conclusion & <span>Perspectives</span>", lines: ["Le TSP est NP-complet mais décidable.", "Held-Karp : exact pour petites instances.", "Branch & Cut : exact pour instances moyennes.", "Métaheuristiques : quasi-optimal pour grandes instances.", "Deep Learning, algorithmes quantiques, PTSP."] },
        { title: "Remerciements", lines: ["Pr. EL HICHAMI Othmane – encadrement exceptionnel.", "Pr. ISMAIL TAHIRI – chef de filière.", "Tous nos professeurs de l'ENS Tétouan.", "Nos familles pour leur soutien indéfectible.", "Merci à vous pour votre attention."] }
    ];
    while(slides.length < 50) slides.push({ title: "Approfondissement", lines: ["Détails supplémentaires sur l'optimisation.", "Notre implémentation Python est disponible.", "Les métriques de performance sont excellentes.", "Le TSP reste un problème passionnant.", "Merci de suivre la présentation."] });

    let currentSlide = 0;
    const totalSlides = slides.length;

    function renderSlides() {
        const wrapper = document.getElementById('slidesWrapper');
        wrapper.innerHTML = '';
        slides.forEach((slide, idx) => {
            const div = document.createElement('div');
            div.className = 'slide';
            if (idx === 0) div.classList.add('active');
            let content = `<div class="slide-content"><div class="slide-header"><div class="slide-title">${slide.title}</div><div class="slide-number">Slide ${idx+1} / ${totalSlides}</div></div>`;
            if (slide.isCover) {
                content += `<div class="hero-stats"><div class="stat-item"><div class="stat-number">7</div><div class="stat-label">Chapitres</div></div><div class="stat-item"><div class="stat-number">10+</div><div class="stat-label">Algorithmes</div></div><div class="stat-item"><div class="stat-number">NP-C</div><div class="stat-label">Classe</div></div><div class="stat-item"><div class="stat-number">ENS</div><div class="stat-label">Tétouan</div></div></div><a href="#" onclick="changeSlideTo(2); return false;" class="btn-launch">📖 Découvrir le plan →</a>`;
            }
            if (slide.schema === "tsp") {
                content += `<div class="graph-schema"><div class="graph-nodes"><div class="graph-node">A</div><span>→</span><div class="graph-node">B</div><span>→</span><div class="graph-node">C</div><span>→</span><div class="graph-node">D</div><span>→</span><div class="graph-node">E</div><span>→</span><div class="graph-node" style="background:#c9a84c;color:#0a1428;">A</div></div><p style="font-size:0.7rem;">Cycle hamiltonien optimal – Passage par toutes les villes</p></div>`;
            }
            if (slide.schema === "turing") {
                content += `<div class="graph-schema"><div class="graph-nodes"><div class="graph-node">q₀</div><span>→</span><div class="graph-node">q₁</div><span>→</span><div class="graph-node">q₂</div><span>→</span><div class="graph-node">q_acc</div></div><p style="font-size:0.7rem;">Machine de Turing – États et transitions (ruban infini)</p></div>`;
            }
            if (slide.schema === "bb") {
                content += `<div class="graph-schema"><div class="graph-nodes"><div class="graph-node">Racine</div></div><div class="graph-nodes"><div class="graph-node">Sous-problème A</div><div class="graph-node">Sous-problème B</div></div><div class="graph-nodes"><div class="graph-node">Élagage ✂️</div><div class="graph-node">Solution</div></div><p style="font-size:0.7rem;">Arbre de recherche Branch & Bound – Élagage des branches non prometteuses</p></div>`;
            }
            for (let line of slide.lines) content += `<p>${line}</p>`;
            if (slide.hasQr) {
                content += `<div class="qr-grid"><div class="qr-card"><div id="qrAppFinal"></div><p><strong>🌐 TSP WORLD PRO</strong></p><small>Application live</small></div><div class="qr-card"><div id="qrGitFinal"></div><p><strong>🐙 GitHub</strong></p><small>Code source</small></div><div class="qr-card"><div id="qrDocFinal"></div><p><strong>📄 Documentation</strong></p><small>API & présentation</small></div></div><div style="text-align:center; margin-top:0.5rem;"><span class="badge"><i class="fas fa-link"></i> prjet-sofien-iliass.vercel.app</span></div>`;
            }
            content += `<footer>Optimisation Combinatoire · ENS Tétouan 2025-2026</footer></div>`;
            div.innerHTML = content;
            wrapper.appendChild(div);
        });
        updateNav();
        if (document.getElementById('qrAppFinal')) generateQR('qrAppFinal', 'https://prjet-sofien-iliass.vercel.app/');
        if (document.getElementById('qrGitFinal')) generateQR('qrGitFinal', 'https://github.com/sofiane-iliass/tsp-world-pro');
        if (document.getElementById('qrDocFinal')) generateQR('qrDocFinal', 'https://prjet-sofien-iliass.vercel.app/presentation');
    }

    function updateNav() {
        document.querySelectorAll('.slide').forEach((s, i) => { if (i === currentSlide) s.classList.add('active'); else s.classList.remove('active'); });
        document.getElementById('slideCounter').innerHTML = `Slide ${currentSlide+1} / ${totalSlides}`;
        document.getElementById('progressBar').style.width = `${((currentSlide+1)/totalSlides)*100}%`;
    }
    function nextSlide() { if (currentSlide < totalSlides-1) { currentSlide++; updateNav(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; updateNav(); } }
    function changeSlideTo(idx) { if (idx >=0 && idx < totalSlides) { currentSlide = idx; updateNav(); } }
    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    renderSlides();
</script>
</body>
</html>
