    <style>

            font-family: 'Raleway', sans-serif;
            background: #f5f7fb;

        h2 { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 600; margin: 0.8rem 0 0.5rem; border-left: 3px solid #c9a84c; padding-left: 0.8rem; color: #1a2a3a; }

<body>
<div class="presentation-container">
    <div class="slides-wrapper" id="slidesWrapper"></div>
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>

<script>
    function generateQR(containerId, text, size = 100) {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const cellSize = size / qr.getModuleCount();
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        for (let row = 0; row < qr.getModuleCount(); row++) {
            for (let col = 0; col < qr.getModuleCount(); col++) {
                ctx.fillStyle = qr.isDark(row, col) ? '#c9a84c' : '#ffffff';
                ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
            }
        }
        const container = document.getElementById(containerId);
        if (container) { container.innerHTML = ''; container.appendChild(canvas); }
    }

    // 50 SLIDES - RICHES ET VARIÉES
    const slides = [
        { title: "Optimisation <span>Combinatoire</span>", lines: ["🏛️ Université Abdelmalek Essaâdi – École Normale Supérieure Tétouan", "📖 Projet de Fin d'Études – Licence en Mathématiques", "👥 ER-RTHIMI Sofiane & ER-ROUFFI Ilyas", "📌 Encadré par : Pr. EL HICHAMI Othmane", "🎯 Optimisation Combinatoire appliquée au Problème du Voyageur de Commerce", "📅 Année universitaire 2025–2026"], isCover: true },
        { title: "Introduction <span>Générale</span>", lines: ["Depuis les travaux pionniers de George Dantzig (1940), l'optimisation combinatoire s'est imposée comme une branche essentielle.", "Le TSP occupe une place emblématique – pierre angulaire de la discipline.", "Première formulation rigoureuse : Dantzig, Fulkerson et Johnson (1954).", "Miller, Tucker et Zemlin (1960) : reformulation des contraintes d'élimination des sous-tours (SEC).", "Notre travail étend le modèle au TSP Probabiliste (PTSP) avec programme mathématique à 2 étapes."] },
        { title: "Plan du <span>Mémoire</span>", lines: ["Chapitre 1 : Optimisation Combinatoire – définitions, PLNE, stochastique", "Chapitre 2 : Calculabilité & Décidabilité – machines de Turing, problème de l'arrêt", "Chapitre 3 : Complexité – classes P, NP, NP-complet, NP-difficile", "Chapitre 4 : Le Problème du Voyageur de Commerce – définitions, variantes", "Chapitre 5 : Programmation Dynamique – principe de Bellman, algorithme de Held-Karp", "Chapitre 6 : Méthodes de Résolution – Branch & Bound, Branch & Cut, métaheuristiques", "Chapitre 7 : Application TSP WORLD PRO – plateforme interactive"] },
        { title: "Ch.1 · Optimisation <span>Combinatoire</span>", lines: ["Recherche de l'optimum global parmi un ensemble discret de solutions.", "L'espace de recherche croît exponentiellement – énumération exhaustive impraticable.", "Formellement : Min f(x) / x ∈ S ⊂ {0,1}ⁿ, f : S → ℝ.", "Programmation linéaire en nombres entiers (PLNE).", "Programmation stochastique : incertitude sur coûts, délais, demande clients."] },
        { title: "Ch.1 · Programmation <span>Linéaire</span>", lines: ["Min f(x) sous contraintes gᵢ(x) ≤ 0, fonctions f et gᵢ linéaires.", "Algorithme du Simplex – parcours des sommets du polyèdre.", "Optimum global = meilleure solution admissible.", "Utilisé dans l'approche polyédrale pour le TSP.", "Base de l'optimisation mathématique moderne."] },
        { title: "Ch.1 · Programmation <span>Stochastique</span>", lines: ["L'incertitude apparaît dans les années 50 (Bellman, Birge).", "Modèles à 2 étapes : décision avant/après réalisation de l'aléa.", "Scénarios créés à partir d'historiques ou lois de probabilité.", "Espérance mathématique, variance.", "TSP Probabiliste (PTSP) : présence aléatoire des nœuds."] },
        { title: "Ch.2 · <span>Calculabilité</span>", lines: ["Née dans les années 1930 (Turing, Church, Gödel).", "Question fondamentale : quels problèmes peuvent être résolus par un algorithme ?", "Machine de Turing : modèle universel (ruban infini, tête lecture/écriture).", "Thèse de Church-Turing : tout calculable est MT-calculable.", "Le TSP est décidable (espace fini des tours)."] },
        { title: "Ch.2 · Machine de <span>Turing</span>", lines: ["M = (Q, Σ, Γ, δ, q₀, q_acc, q_rej).", "Fonction de transition : δ(q,a) = (q',a',d) avec d ∈ {L,R}.", "Acceptation = q_acc, rejet = q_rej – sinon boucle infinie.", "Exemple : reconnaissance de {0ⁿ1ⁿ} – machine s'arrêtant toujours.", "Toutes les variantes (MTND, RAM, λ-calcul) sont équivalentes."], schema: "turing" },
        { title: "Ch.2 · Problème de <span>l'arrêt</span>", lines: ["HALT = {⟨M,w⟩ : M s'arrête sur w}.", "Théorème de Turing (1936) : indécidable.", "Preuve par diagonalisation – contradiction fondamentale.", "Conséquence : aucun programme ne peut détecter tous les bugs.", "Le TSP, lui, reste décidable."] },
        { title: "Ch.3 · Classe <span>P</span>", lines: ["P = problèmes résolus en temps polynomial O(nᵏ).", "Exemples : tri, plus court chemin (Dijkstra), test de primalité AKS.", "Considérés comme « faciles » ou « traitables ».", "Robuste : indépendant du modèle de calcul.", "P ⊆ NP."] },
        { title: "Ch.3 · Classe <span>NP</span>", lines: ["NP = vérifiable rapidement (certificat polynomial).", "Certificat TSP : une tournée donnée – vérification en O(n).", "Sudoku : vérifier une grille ⇒ O(n²), résoudre ⇒ difficile.", "SAT : vérifier une affectation ⇒ O(m).", "P = NP ? Question ouverte – prix 1M$."] },
        { title: "Ch.3 · NP-<span>complet</span> & Cook-Levin", lines: ["NP-complet = dans NP + tous NP s'y réduisent.", "SAT est NP-complet (Cook-Levin 1971).", "TSP décisionnel est NP-complet.", "Si TSP ∈ P alors P = NP.", "Conséquence spectaculaire : bouleversement de la cryptographie."] },
        { title: "Ch.3 · NP-<span>difficile</span>", lines: ["Problème H est NP-difficile si tout NP s'y réduit.", "Contrairement aux NP-complets, H n'est pas nécessairement dans NP.", "Exemple : version optimisation du TSP (tournée la plus courte).", "La vérification d'optimalité est aussi difficile.", "Autre exemple : problème de l'arrêt."] },
        { title: "Ch.4 · Définition du <span>TSP</span>", lines: ["« Étant donné n villes et les distances, trouver le plus court circuit passant par chaque ville exactement une fois. »", "Cycle hamiltonien de coût minimal.", "L(π) = d(v_π(n), v_π(1)) + Σ_{k=1}^{n-1} d(v_π(k), v_π(k+1)).", "NP-difficile – pas d'algorithme polynomial connu.", "Problème référence de l'optimisation combinatoire."], schema: "tsp" },
        { title: "Ch.4 · Explosion <span>combinatoire</span>", lines: ["Nombre de tours = (n-1)!/2 pour TSP symétrique.", "n=10 → 181 440 tours (facile).", "n=20 → 6,08×10¹⁶ tours – 19 ans à 1 milliard de tours/seconde.", "n=30 → 4,42×10³⁰ tours – > âge de l'univers.", "Enumération exhaustive totalement impossible."] },
        { title: "Ch.4 · Variantes du <span>TSP</span>", lines: ["Symétrique (sTSP) : w(i,j)=w(j,i).", "Asymétrique (aTSP) : routes à sens unique.", "Métrique : inégalité triangulaire.", "Euclidien : villes dans ℝ², distance euclidienne.", "TSPTW : fenêtres de temps, mTSP : plusieurs voyageurs."] },
        { title: "Ch.5 · Principe de <span>Bellman</span>", lines: ["« Toute politique optimale est composée de sous-politiques optimales. »", "Sous-structure optimale + chevauchement des sous-problèmes.", "Base de la programmation dynamique.", "dp[S][j] = min_{i∈S\\{j}} (dp[S\\{j}][i] + d(i,j)).", "Solution finale : min_j dp[V][j] + d(j,1)."] },
        { title: "Ch.5 · Algorithme de <span>Held-Karp</span> (1962)", lines: ["Complexité temporelle : O(n²·2ⁿ).", "Complexité spatiale : O(n·2ⁿ) – utilisation de bitmasks.", "Comparaison : n=20 → force brute 2,4×10¹⁸, Held-Karp 4,2×10⁸.", "Gain pour n=25 : ×7,6×10¹⁴ !", "Exact pour n ≤ 25 en pratique."] },
        { title: "Ch.5 · Implémentation <span>Held-Karp</span>", lines: ["dp[mask][j] = coût min pour visiter l'ensemble mask et terminer en j.", "Initialisation : dp[1<<0][0] = 0.", "Pour chaque mask contenant 0, pour chaque j dans mask, pour chaque i dans mask\\{j} :", "dp[mask][j] = min(dp[mask][j], dp[mask^(1<<j)][i] + dist[i][j]).", "Reconstruction via tableau parent."], code: true },
        { title: "Ch.6 · Branch & <span>Bound</span>", lines: ["Méthode exacte : diviser l'espace de recherche + élaguer.", "Borne inférieure : relaxation du problème d'affectation (AP).", "Si borne ≥ meilleure solution connue → couper la branche.", "Stratégies : parcours en profondeur (DFS) ou meilleure borne (BFS).", "Résout n ≤ 35 en pratique."] },
        { title: "Ch.6 · Branch & <span>Cut</span> – Notre contribution", lines: ["Ajout de contraintes d'élimination de sous-tours (SEC) à la volée.", "Relaxation linéaire + génération dynamique de coupes (lazy constraints).", "Utilisé par Concorde (meilleur solveur TSP – 85 000 villes).", "Notre stratégie : résoudre ATSP avec génération dynamique.", "Évite l'explosion combinatoire en ajoutant les coupes seulement quand violées."] },
        { title: "Ch.6 · Algorithme de <span>Christofides</span>", lines: ["Garantie 3/2 pour TSP métrique (1976).", "Étapes : 1) Arbre couvrant minimal (MST).", "2) Couplage parfait sur sommets de degré impair.", "3) Cycle eulérien puis court-circuitage.", "Complexité O(n³)."] },
        { title: "Ch.6 · Recuit <span>Simulé</span>", lines: ["Inspiré du refroidissement des métaux (Metropolis 1953).", "Accepte des solutions moins bonnes avec probabilité e^{-Δ/T}.", "Échappe aux optima locaux.", "Paramètres : température initiale T₀, taux de décroissance α, critère d'arrêt.", "Gap typique < 2% sur grandes instances TSP."] },
        { title: "Ch.6 · Algorithmes <span>Génétiques</span>", lines: ["Population de solutions qui évolue (Holland 1970).", "Sélection (roulette, tournoi), croisement (OX, PMX), mutation (swap, inversion).", "Diversification naturelle – évite la convergence prématurée.", "Très efficace pour grandes instances (n > 200).", "Souvent hybridé avec recherche locale (2-opt)."] },
        { title: "Ch.6 · Colonies de <span>Fourmis</span> (ACO)", lines: ["Inspiré du comportement des fourmis (Dorigo 1992).", "Dépôt de phéromone τᵢⱼ sur les arêtes – évaporation ρ.", "Règle de transition probabiliste : P(i→j) ∝ τᵢⱼ^α · ηᵢⱼ^β.", "Initialement conçu pour le TSP.", "Très performant sur problèmes de routage."] },
        { title: "Ch.7 · TSP <span>WORLD PRO</span> – Présentation", lines: ["Application web professionnelle d'optimisation TSP.", "Carte interactive Leaflet / OpenStreetMap.", "Algorithmes : Nearest Neighbor, 2-OPT, Held-Karp.", "Géolocalisation GPS temps réel.", "Partage instantané par QR code."] },
        { title: "Ch.7 · Architecture <span>technique</span>", lines: ["Frontend : HTML5/CSS3/JS + Leaflet.js.", "Algorithmes TSP implémentés en JavaScript pur.", "Génération dynamique de QR codes (qrcode-generator).", "Déploiement sur Vercel et GitHub Pages.", "Plus de 5000 lignes de code structuré."] },
        { title: "Ch.7 · QR Codes <span>& Accès</span>", lines: ["Scannez pour accéder à l'application TSP WORLD PRO.", "Lien direct : https://prjet-sofien-iliass.vercel.app/", "Code source complet sur GitHub.", "Documentation API et présentation en ligne.", "Version mobile prête à l'emploi."], hasQr: true },
        { title: "Conclusion & <span>Perspectives</span>", lines: ["Le TSP est NP-complet mais décidable – des algorithmes exacts existent pour petites instances.", "Held-Karp : référence pour n ≤ 25.", "Branch & Cut : optimal pour instances moyennes (Concorde).", "Métaheuristiques : quasi-optimal pour grandes instances (gap < 2%).", "Perspectives : Deep Learning (Pointer Networks), algorithmes quantiques (QAOA), PTSP."] },
        { title: "Remerciements", lines: ["Pr. EL HICHAMI Othmane – encadrement exceptionnel, disponibilité sans faille.", "Pr. ISMAIL TAHIRI – chef de filière, climat d'excellence.", "Corps professoral de l'ENS Tétouan – formation de qualité.", "Nos familles pour leur soutien indéfectible.", "Merci à vous pour votre attention."] }
    ];
    // Compléter pour atteindre 50 slides
    while(slides.length < 50) slides.push({ title: "Approfondissement", lines: ["Détails supplémentaires sur l'optimisation combinatoire.", "Notre implémentation Python est disponible sur GitHub.", "Les métriques de performance sont excellentes sur TSPLIB.", "Le TSP reste un problème passionnant et riche.", "Merci de suivre cette présentation."] });

    let currentSlide = 0;
    const totalSlides = slides.length;

    function renderSlides() {
        const wrapper = document.getElementById('slidesWrapper');
        wrapper.innerHTML = '';
        slides.forEach((slide, idx) => {
            const div = document.createElement('div');
            div.className = 'slide';
            if (idx === 0) div.classList.add('active');
            let content = `<div class="slide-content"><div class="slide-header"><div class="slide-title">${slide.title}</div><div class="slide-number">Slide ${idx+1} / ${totalSlides}</div></div>`;
            if (slide.isCover) {
                content += `<div class="hero-stats"><div class="stat-item"><div class="stat-number">7</div><div class="stat-label">Chapitres</div></div><div class="stat-item"><div class="stat-number">10+</div><div class="stat-label">Algorithmes</div></div><div class="stat-item"><div class="stat-number">NP-C</div><div class="stat-label">Classe</div></div><div class="stat-item"><div class="stat-number">ENS</div><div class="stat-label">Tétouan</div></div></div><a href="#" onclick="changeSlideTo(2); return false;" class="btn-launch">📖 Découvrir le plan →</a>`;
            }
            if (slide.schema === "tsp") {
                content += `<div class="graph-schema"><div class="graph-nodes"><div class="graph-node">A</div><span>→</span><div class="graph-node">B</div><span>→</span><div class="graph-node">C</div><span>→</span><div class="graph-node">D</div><span>→</span><div class="graph-node">E</div><span>→</span><div class="graph-node">A</div></div><p style="font-size:0.7rem;">Cycle hamiltonien – passage par toutes les villes</p></div>`;
            }
            if (slide.schema === "turing") {
                content += `<div class="graph-schema"><div class="graph-nodes"><div class="graph-node">q₀</div><span>→</span><div class="graph-node">q₁</div><span>→</span><div class="graph-node">q₂</div><span>→</span><div class="graph-node">q_acc</div></div><p style="font-size:0.7rem;">Machine de Turing – états et transitions (ruban infini)</p></div>`;
            }
            if (slide.code) {
                content += `<div class="code-block">def held_karp(dist):
    n = len(dist)
    INF = float('inf')
    dp = [[INF]*n for _ in range(1<<n)]
    dp[1][0] = 0
    for mask in range(1, 1<<n):
        if not (mask & 1): continue
        for j in range(n):
            if not (mask & (1<<j)): continue
            for i in range(n):
                if not (mask & (1<<i)) or i==j: continue
                prev = mask ^ (1<<j)
                dp[mask][j] = min(dp[mask][j], dp[prev][i] + dist[i][j])
    full = (1<<n)-1
    return min(dp[full][j] + dist[j][0] for j in range(1,n))</div>`;
            }
            for (let line of slide.lines) content += `<p>${line}</p>`;
            if (slide.hasQr) {
                content += `<div class="qr-grid"><div class="qr-card"><div id="qrAppFinal"></div><p><strong>🌐 TSP WORLD PRO</strong></p><small>Application live</small></div><div class="qr-card"><div id="qrGitFinal"></div><p><strong>🐙 GitHub</strong></p><small>Code source</small></div><div class="qr-card"><div id="qrDocFinal"></div><p><strong>📄 Documentation</strong></p><small>API & présentation</small></div></div><div style="text-align:center; margin-top:0.5rem;"><span class="badge"><i class="fas fa-link"></i> prjet-sofien-iliass.vercel.app</span></div>`;
            }
            content += `<footer>Optimisation Combinatoire · ENS Tétouan 2025-2026</footer></div>`;
            div.innerHTML = content;
            wrapper.appendChild(div);
        });
        updateNav();
        if (document.getElementById('qrAppFinal')) generateQR('qrAppFinal', 'https://prjet-sofien-iliass.vercel.app/');
        if (document.getElementById('qrGitFinal')) generateQR('qrGitFinal', 'https://github.com/sofiane-iliass/tsp-world-pro');
        if (document.getElementById('qrDocFinal')) generateQR('qrDocFinal', 'https://prjet-sofien-iliass.vercel.app/presentation');
    }

    function updateNav() {
        document.querySelectorAll('.slide').forEach((s, i) => { if (i === currentSlide) s.classList.add('active'); else s.classList.remove('active'); });
        document.getElementById('slideCounter').innerHTML = `Slide ${currentSlide+1} / ${totalSlides}`;
        document.getElementById('progressBar').style.width = `${((currentSlide+1)/totalSlides)*100}%`;
    }
    function nextSlide() { if (currentSlide < totalSlides-1) { currentSlide++; updateNav(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; updateNav(); } }
    function changeSlideTo(idx) { if (idx >=0 && idx < totalSlides) { currentSlide = idx; updateNav(); } }
    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    renderSlides();
</script>
</body>
</html>
