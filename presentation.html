<script>
const slides = JSON.parse(document.getElementById('slide-data').textContent);
const stage = document.getElementById('stage');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function renderSlide(slide, i){
  const section = document.createElement('section'); section.className = 'slide ' + (slide.kind || '');
  const body = slide.kind === 'cover'
    ? `<div class="cover-grid"><div><span class="kicker">${escapeHtml(slide.chapter)}</span><h1>${escapeHtml(slide.title).replace('Combinatoire','<span class="gold">Combinatoire</span>').replace('Voyageur de Commerce','<span class="teal">Voyageur de Commerce</span>')}</h1><div class="body"><p>${escapeHtml(slide.body[0])}</p></div><p style="margin-top:28px;color:#5b6b80;font-weight:800">${escapeHtml(slide.meta||'')}</p></div><div class="metric"><div><strong>${slides.length}</strong>slides détaillées</div><div><strong>← →</strong>navigation clavier</div><div><strong>PDF</strong>export prêt</div></div></div>`
    : `<span class="kicker">${escapeHtml(slide.chapter)}</span><h2>${escapeHtml(slide.title)}</h2><div class="body">${slide.body.length > 1 ? '<ul>'+slide.body.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>' : '<p>'+escapeHtml(slide.body[0]||'')+'</p>'}</div>${slide.meta?'<p style="margin-top:24px;color:#6b7b8d;font-weight:800">'+escapeHtml(slide.meta)+'</p>':''}`;
  section.innerHTML = `<div class="card">${body}</div>`; return section;
}
stage.append(...slides.map(renderSlide));
const els=[...document.querySelectorAll('.slide')], prev=document.getElementById('prevBtn'), next=document.getElementById('nextBtn'), counter=document.getElementById('counter'), progress=document.getElementById('progress'), dots=document.getElementById('dots');
dots.innerHTML = slides.slice(0,28).map((_,i)=>`<span class="dot" data-dot="${i}"></span>`).join('');
let current = Math.max(0, Math.min((Number(new URLSearchParams(location.search).get('slide'))||1)-1, els.length-1));
function show(i){current=Math.max(0,Math.min(i,els.length-1)); els.forEach((el,k)=>el.classList.toggle('active',k===current)); prev.disabled=current===0; next.disabled=current===els.length-1; counter.textContent=`${current+1} / ${els.length}`; progress.style.width=`${((current+1)/els.length)*100}%`; document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('active',k===Math.min(current,27))); history.replaceState(null,'',`?slide=${current+1}`);}
prev.onclick=()=>show(current-1); next.onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{ if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(current+1)} if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(current-1)} if(e.key==='Home')show(0); if(e.key==='End')show(els.length-1); });
show(current);
</script>
